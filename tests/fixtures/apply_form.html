<!doctype html><html><head><meta charset="utf-8"><title>Apply - Test Co</title></head><body>
<h1>Product Marketing Manager</h1>
<form id="application_form" onsubmit="window.SUBMITTED = true; return false;">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" name="phone"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div><label for="q1">LinkedIn Profile</label><input id="q1" name="question_1"></div>
  <div><label for="q2">Current Company</label><input id="q2" name="question_2"></div>
  <div><label for="q3">Expected CTC</label><input id="q3" name="question_3"></div>
  <div><label for="q4">Why do you want to join us? *</label><textarea id="q4" name="question_4" required></textarea></div>
  <div><label for="q5">Do you require visa sponsorship? *</label><input id="q5" name="question_5" required></div>
  <div><label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label></div>
  <button type="submit" id="submit_app">Submit Application</button>
</form></body></html>
